name: Deploy Public Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        env:
          PAGES_REMOTE_API_BASE: ${{ vars.PAGES_REMOTE_API_BASE }}
        run: |
          set -euo pipefail
          mkdir -p _site
          files=(
            index.html
            admin.html
            clinician.html
            sensor.html
            app.mjs
            admin.mjs
            clinician.mjs
            sensor.mjs
            models.mjs
            storage.mjs
            auth.mjs
            record-utils.mjs
            runtime-config.js
            styles.css
          )

          for file in "${files[@]}"; do
            test -f "$file"
            cp "$file" _site/
          done

          if [ -n "${PAGES_REMOTE_API_BASE:-}" ]; then
            printf 'window.WIREGENE_REMOTE_API_BASE = "%s";\n' "$PAGES_REMOTE_API_BASE" > _site/runtime-config.js
          fi

          touch _site/.nojekyll

      - name: Show prepared files
        run: ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
