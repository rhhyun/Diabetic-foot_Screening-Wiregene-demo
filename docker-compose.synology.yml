services:
  app:
    image: "${APP_IMAGE:?APP_IMAGE must be set in deploy/synology/site.env}"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    env_file:
      - "${APP_ENV_FILE:?APP_ENV_FILE must point to the production environment file}"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const b=await r.json();if(!r.ok||b.ok!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
